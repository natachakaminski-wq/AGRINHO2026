<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Forte - Futuro Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🌱 Agro Forte, Futuro Sustentável</h1>

        <div class="status">
            <p>Pontos: <span id="score">0</span></p>
            <p>Sustentabilidade: <span id="eco">50</span>%</p>
            <p>Tempo: <span id="time">60</span>s</p>
        </div>

        <div class="farm">
            <button class="action" onclick="plantar()">🌾 Plantar</button>
            <button class="action" onclick="irrigar()">💧 Irrigar</button>
            <button class="action" onclick="colher()">🚜 Colher</button>
        </div>

        <div id="message">
            Construa uma fazenda sustentável!
        </div>

        <button id="restart" onclick="reiniciar()">
            Jogar Novamente
        </button>
    </div>

    <script src="script.js"></script>

</body>
</html>
